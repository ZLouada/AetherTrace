name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Build, Lint & Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Type check monorepo
        run: pnpm check-types

      - name: Build all packages & apps
        run: pnpm build

      - name: Run Phase 1 Smoke Test (Proxy & Breakers)
        run: pnpm test:smoke

      - name: Run Phase 3 E2E Test (SDK & .trace Bundles)
        run: pnpm test:e2e

      - name: Run Phase 4 Live Breakpoint & Chaos Test
        run: pnpm test:phase4

