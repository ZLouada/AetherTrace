[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aethertrace"
version = "0.2.0"
description = "Wireshark for AI Agents - Python Context Propagation SDK"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "AetherTrace Team", email = "architect@aethertrace.dev" }]
keywords = ["llm", "agents", "tracing", "observability", "debugging", "wireshark"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/aethertrace/aethertrace"
Repository = "https://github.com/aethertrace/aethertrace"
